<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>러닝머신 인터벌 타이머 PWA</title>

  <!-- Pretendard Modern Web Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- PWA Settings -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="stylesheet" href="style.css" />
</head>
<body class="theme-WARMUP">

<div class="app">

  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="top-bar-left">
      <button id="pipBtn" class="pip-btn" aria-label="Picture-in-Picture Toggle">🖼️</button>
      <button id="muteBtn" class="mute-btn" aria-label="Mute Toggle">🔊</button>
    </div>
    <div id="status" class="status WARMUP">WARMUP</div>
    <div class="top-bar-right">
      <button id="settingsBtn" class="settings-btn" aria-label="Settings">
        ⚙️
      </button>
    </div>
  </div>

  <!-- TIME DISPLAY WITH CIRCULAR PROGRESS RING -->
  <div id="timerContainer" class="timer-container">
    <svg class="progress-ring" viewBox="0 0 280 280">
      <circle class="progress-ring__bg" cx="140" cy="140" r="125" />
      <circle class="progress-ring__circle" id="progressCircle" cx="140" cy="140" r="125" />
    </svg>
    <div class="timer-center">
      <div id="intervalTime" class="interval-time">00:00</div>
      <div class="top-meta">
        <div id="setCount" class="set-count">Set 1</div>
        <div id="setDots" class="set-dots"></div>
        <div id="totalTime" class="total-time">Total 00:00</div>
      </div>
    </div>
  </div>

  <!-- QUICK TIME ADJUST BAR -->
  <div class="quick-adjust-bar">
    <button id="sub10Btn" class="quick-adj-btn" aria-label="-10 seconds">-10s</button>
    <button id="add10Btn" class="quick-adj-btn" aria-label="+10 seconds">+10s</button>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <button id="toggleBtn">START</button>
    <button id="resetBtn">RESET</button>
  </div>

</div>

<!-- OVERLAY -->
<div id="overlay" class="overlay"></div>

<!-- SETTINGS PANEL -->
<div id="settings" class="settings">
  <div class="settings-header">
    <span>Settings</span>
    <button id="closeSettingsBtn">✕</button>
  </div>

  <!-- PRESETS SECTION -->
  <div class="settings-group">
    <div class="preset-header">
      <div class="settings-group-title">Presets</div>
      <button id="savePresetBtn" class="save-preset-btn">+ Save Current</button>
    </div>
    <div id="presetsList" class="presets-chips-container"></div>
  </div>

  <!-- WARMUP / FINISH -->
  <div class="settings-group">
    <div class="settings-group-title">Prep & Finish</div>
    <div class="setting-item">
      <label>WARMUP (sec)</label>
      <div class="stepper-box">
        <button type="button" class="step-btn" data-target="warmupInput" data-step="-5">-</button>
        <input id="warmupInput" type="number" min="0" />
        <button type="button" class="step-btn" data-target="warmupInput" data-step="5">+</button>
      </div>
    </div>
    <div class="setting-item">
      <label>FINISH (sec)</label>
      <div class="stepper-box">
        <button type="button" class="step-btn" data-target="finishInput" data-step="-5">-</button>
        <input id="finishInput" type="number" min="0" />
        <button type="button" class="step-btn" data-target="finishInput" data-step="5">+</button>
      </div>
    </div>
  </div>

  <!-- MAIN INTERVAL SETTINGS -->
  <div class="settings-group">
    <div class="settings-group-title">Interval</div>
    <div class="setting-item">
      <label>RUN (sec)</label>
      <div class="stepper-box">
        <button type="button" class="step-btn" data-target="runInput" data-step="-5">-</button>
        <input id="runInput" type="number" min="1" />
        <button type="button" class="step-btn" data-target="runInput" data-step="5">+</button>
      </div>
    </div>
    <div class="setting-item">
      <label>WALK (sec)</label>
      <div class="stepper-box">
        <button type="button" class="step-btn" data-target="walkInput" data-step="-5">-</button>
        <input id="walkInput" type="number" min="1" />
        <button type="button" class="step-btn" data-target="walkInput" data-step="5">+</button>
      </div>
    </div>
    <div class="setting-item">
      <label>Set Count</label>
      <div class="stepper-box">
        <button type="button" class="step-btn" data-target="setInput" data-step="-1">-</button>
        <input id="setInput" type="number" min="1" />
        <button type="button" class="step-btn" data-target="setInput" data-step="1">+</button>
      </div>
    </div>
  </div>

  <!-- DATA & BACKUP SECTION -->
  <div class="settings-group">
    <div class="settings-group-title">Data & Backup</div>
    <div id="calendarExportImport" class="backup-sub-controls">
      <button id="exportCalendarBtn" type="button" class="backup-btn">JSON EXPORT</button>
      <button id="importCalendarBtn" type="button" class="backup-btn">JSON IMPORT</button>
    </div>
  </div>
</div>

<!-- CALENDAR PANEL (Full-Height Right-to-Left Drawer) -->
<div id="calendar" class="calendar" aria-hidden="true">
  <div class="calendar-header">
    <div class="calendar-nav">
      <button id="prevMonthBtn" class="cal-nav" aria-label="Previous month">◀</button>
      <div id="calendarMonthYear" class="calendar-month-year"></div>
      <button id="nextMonthBtn" class="cal-nav" aria-label="Next month">▶</button>
    </div>
    <div id="streakCounter" class="streak-badge">🔥 0일 연속 러닝!</div>
    <button id="closeCalendarBtn" class="settings-header-button" aria-label="Close calendar">✕</button>
  </div>

  <div class="calendar-grid">
    <div class="calendar-weekdays">
      <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>
    <div id="calendarDays" class="calendar-days"></div>
  </div>

  <div id="calendarDetails" class="calendar-details">
    <div id="selectedDateLabel" class="settings-group-title"></div>

    <div class="calendar-summary">
      <div id="weekSummary" class="calendar-summary-item">Week: 00:00 · 0.00 km</div>
      <div id="monthSummary" class="calendar-summary-item">Month: 00:00 · 0.00 km</div>
    </div>

    <div class="calendar-card">
      <div class="setting-item">
        <label>Run Distance (km)</label>
        <input id="runDistInput" type="number" inputmode="decimal" step="0.01" placeholder="0.00" />
      </div>
      <div class="setting-item">
        <label>Run Time (min)</label>
        <input id="runTimeInput" type="number" inputmode="numeric" min="0" step="1" placeholder="mm" />
      </div>
      <div class="setting-item">
        <label>GYM</label>
        <input id="gymCheckbox" type="checkbox" />
      </div>

      <div class="controls">
        <button id="saveRunBtn">SAVE</button>
        <button id="deleteRunBtn">DELETE</button>
      </div>
    </div>
  </div>
</div>

<canvas id="pipCanvas" width="300" height="300" style="display:none;"></canvas>
<video id="pipVideo" autoplay muted playsinline style="display:none;"></video>
<input id="importCalendarFile" type="file" accept=".txt,.json" style="display:none" />
<script src="app.js"></script>
</body>
</html>
